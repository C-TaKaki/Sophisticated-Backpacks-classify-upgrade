modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
Sophisticated Backpacks 附属模组（1.21.1 / NeoForge）
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "sophisticatedcore"
type = "required"
versionRange = "[1.5.28,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "sophisticatedbackpacks"
type = "required"
versionRange = "[3.26.0,)"
ordering = "AFTER"
side = "BOTH"

# 接管背包网格的槽位布局，实现"按模组分块 + 整行分类横幅"
[[mixins]]
config = "sbaddon.mixins.json"

